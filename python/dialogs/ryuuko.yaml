# every hiragana for pronunciation clips, one line each: the 46 basic kana
# (あ to ん), dakuten (が to ぼ, plus ゔ), handakuten (ぱ to ぽ) and small kana
# (ぁ ぃ ぅ ぇ ぉ ゃ ゅ ょ っ ゎ). Each renders to public/dialog/ryuuko/<kana>.mp3.
# The basic 46 keep the exact text and style they were rendered with, so
# they hit the .cache and only the new kana call the API. The shared style
# keeps the TTS from adding words around a lone character
